# rinko-log 日志服务配置
server:
  port: 10317

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://postgres:5432/rinko_log?currentSchema=log
    username: postgres
    password: rinko
    druid:
      initial-size: 20
      max-active: 100
      min-idle: 5
      max-wait: 60000
      filter:
        stat:
          enabled: false
          log-slow-sql: false
          slow-sql-millis: 2000
        wall:
          enabled: true
          config:
            multi-statement-allow: false
            none-base-statement-allow: false
  data:
    redis:
      host: redis
      port: 6379
      database: 0
      password: rinko_redis_2024
  kafka:
    bootstrap-servers: kafka:9092
# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

rinko:
  log:
    sampling-rate: 1.0
    clickhouse:
      host: clickhouse
      port: 8123
      database: rinko_log
      username: rinko
      password: anchorage
