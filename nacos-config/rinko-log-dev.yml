# rinko-log 日志服务配置
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/rinko_log
    username: postgres
    password: rinko
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  kafka:
    bootstrap-servers: localhost:9092

rinko:
  flyway:
    enabled: true
  log:
    sampling-rate: 1.0
    clickhouse:
      host: localhost
      port: 8123
      database: rinko_log
      username: rinko
      password: anchorage
