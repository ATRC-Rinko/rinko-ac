# rinko-notify 通知服务配置
server:
  port: 10318

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://postgres:5432/rinko_notify?currentSchema=notify
    username: postgres
    password: rinko
    druid:
      initial-size: 20
      max-active: 100
      min-idle: 5
      max-wait: 60000
      filter:
        stat:
          enabled: false
          log-slow-sql: false
          slow-sql-millis: 2000
        wall:
          enabled: true
          config:
            multi-statement-allow: false
            none-base-statement-allow: false
  data:
    redis:
      host: redis
      port: 6379
      password: rinko_redis_2024
      database: 1
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: rinko
    password: anchorage

rinko:
  notify:
    channels:
      email:
        enabled: true
      sms:
        enabled: false
