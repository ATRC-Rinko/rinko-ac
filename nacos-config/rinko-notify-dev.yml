# rinko-notify 通知服务配置
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/rinko_notify
    username: postgres
    password: rinko
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  rabbitmq:
    host: localhost
    port: 5672
    username: rinko
    password: anchorage
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: rinko-notify
      auto-offset-reset: earliest

rinko:
  notify:
    channels:
      email:
        enabled: true
      sms:
        enabled: false
