# rinko-oss 对象存储服务配置
server:
  port: 10319

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://postgres:5432/rinko_oss?currentSchema=oss
    username: postgres
    password: rinko
    druid:
      initial-size: 20
      max-active: 100
      min-idle: 5
      max-wait: 60000
      filter:
        stat:
          enabled: false
          log-slow-sql: false
          slow-sql-millis: 2000
        wall:
          enabled: true
          config:
            multi-statement-allow: false
            none-base-statement-allow: false

rinko:
  oss:
    storage-type: local
    local:
      base-path: ./data/oss
    s3:
      endpoint: http://rustfs:9000
      access-key: rustfsadmin
      secret-key: rustfsadmin
      bucket: rinko-oss
      region: us-east-1
    thumbnail:
      resolutions:
        - label: small
          maxWidth: 200
        - label: medium
          maxWidth: 800
        - label: large
          maxWidth: 1600
    video:
      resolutions:
        - label: 480p
          width: 854
          height: 480
          bitrate: 1M
        - label: 720p
          width: 1280
          height: 720
          bitrate: 2.5M
        - label: 1080p
          width: 1920
          height: 1080
          bitrate: 5M
