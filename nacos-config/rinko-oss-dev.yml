# rinko-oss 对象存储服务配置
spring:
  kafka:
    bootstrap-servers: localhost:9092
  datasource:
    url: jdbc:postgresql://localhost:5432/rinko_oss
    username: postgres
    password: rinko
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

rinko:
  flyway:
    enabled: true
  oss:
    storage-type: local
    local:
      base-path: ./data/oss
    s3:
      endpoint: http://localhost:9000
      access-key: minioadmin
      secret-key: minioadmin
      bucket: rinko-oss
      region: us-east-1
    thumbnail:
      width: 200
      height: 200
    video:
      resolutions:
        - label: 480p
          width: 854
          height: 480
          bitrate: 1M
        - label: 720p
          width: 1280
          height: 720
          bitrate: 2.5M
        - label: 1080p
          width: 1920
          height: 1080
          bitrate: 5M
