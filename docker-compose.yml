version: "3.9"

services:
  # ==================== Nacos ====================
  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: rinko-nacos
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
    ports:
      - "18848:8848"
      - "19848:9848"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== PostgreSQL ====================
  postgres:
    image: postgres:16-alpine
    container_name: rinko-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rinko
      POSTGRES_DB: rinko_admin
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: rinko-redis
    command: redis-server --requirepass rinko_redis_2024
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "rinko_redis_2024", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== RabbitMQ ====================
  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: rinko-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: rinko
      RABBITMQ_DEFAULT_PASS: anchorage
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== Zookeeper ====================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.8.0
    container_name: rinko-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log

  # ==================== Kafka ====================
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: rinko-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 15

  # ==================== ClickHouse ====================
  clickhouse:
    image: clickhouse/clickhouse-server:24.12-alpine
    container_name: rinko-clickhouse
    environment:
      CLICKHOUSE_USER: rinko
      CLICKHOUSE_PASSWORD: anchorage
      CLICKHOUSE_DB: rinko_log
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-log:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "clickhouse-client", "-u", "rinko", "--password", "anchorage", "-q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== SkyWalking OAP ====================
  skywalking-oap:
    image: apache/skywalking-oap-server:10.1.0
    container_name: rinko-skywalking-oap
    environment:
      SW_STORAGE: h2
    ports:
      - "11800:11800"
      - "12800:12800"
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -f http://localhost:12800/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== SkyWalking UI ====================
  skywalking-ui:
    image: apache/skywalking-ui:10.1.0
    container_name: rinko-skywalking-ui
    depends_on:
      - skywalking-oap
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    ports:
      - "8080:8080"

  # ==================== Seata Server ====================
  seata-server:
    image: seataio/seata-server:2.2.0
    container_name: rinko-seata
    depends_on:
      - nacos
      - postgres
    environment:
      - SEATA_PORT=8091
      - SEATA_IP=seata-server
    ports:
      - "8091:8091"
      - "7091:7091"
    volumes:
      - seata-data:/seata-server/logs

volumes:
  nacos-data:
  postgres-data:
  redis-data:
  rabbitmq-data:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  clickhouse-data:
  clickhouse-log:
  seata-data:
