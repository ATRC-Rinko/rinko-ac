version: "3.9"

services:
  # ==================== Nacos ====================
  nacos:
    image: nacos/nacos-server:v2.5.2
    container_name: rinko-nacos
    environment:
      - MODE=standalone
      - PREFER_HOST_MODE=hostname
      - NACOS_AUTH_TOKEN=VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg=
      - NACOS_AUTH_IDENTITY_KEY=rinko
      - NACOS_AUTH_IDENTITY_VALUE=anchorage
    ports:
      - "18848:8848"
      - "19848:9848"
      - "18080:8080"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== PostgreSQL ====================
  postgres:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    container_name: rinko-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rinko
      POSTGRES_DB: anchorage
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/init-sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== Redis ====================
  redis:
    image: redis:latest
    container_name: rinko-redis
    command: redis-server --requirepass rinko_redis_2024
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "rinko_redis_2024", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== RabbitMQ ====================
  rabbitmq:
    image: rabbitmq:latest
    container_name: rinko-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: rinko
      RABBITMQ_DEFAULT_PASS: anchorage
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== Kafka ====================
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: rinko-kafka
    environment:
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 5s
      retries: 15

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "18081:8080"
    depends_on:
      - kafka
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka:9092

  # ==================== ClickHouse ====================
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: rinko-clickhouse
    environment:
      CLICKHOUSE_USER: rinko
      CLICKHOUSE_PASSWORD: anchorage
      CLICKHOUSE_DB: rinko_logs
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-log:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "clickhouse-client", "-u", "rinko", "--password", "anchorage", "-q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== SkyWalking OAP ====================
  skywalking-oap:
    image: apache/skywalking-oap-server:latest
    container_name: rinko-skywalking-oap
    environment:
      SW_STORAGE: postgresql
      SW_JDBC_URL: jdbc:postgresql://postgres:5432/oap
      SW_DATA_SOURCE_USER: postgres
      SW_DATA_SOURCE_PASSWORD: rinko
      SW_CORE_DEFAULT_CACHE_EXPIRATION: 300
    ports:
      - "11800:11800"
      - "12800:12800"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -f http://localhost:12800/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==================== SkyWalking UI ====================
  skywalking-ui:
    image: apache/skywalking-ui:latest
    container_name: rinko-skywalking-ui
    depends_on:
      - skywalking-oap
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    ports:
      - "8080:8080"

  # ==================== Seata Server ====================
  seata-server:
    image: apache/seata-server:2.6.0
    container_name: rinko-seata
    depends_on:
      - nacos
      - postgres
    environment:
      - SEATA_PORT=8091
      - HOST=0.0.0.0
      - SEATA_IP=seata-server
    ports:
      - "8091:8091"
      - "7091:7091"
    volumes:
      - "/usr/share/zoneinfo/Asia/Shanghai:/etc/localtime"
      - "/usr/share/zoneinfo/Asia/Shanghai:/etc/timezone"
      - "./docker/seata-server/application.yml:/seata-server/resources/application.yml"
      - seata-data:/seata-server/logs
  # ==================== RustFS ====================
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rinko-rustfs
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      - RUSTFS_VOLUMES=/data/rustfs0
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
      - RUSTFS_OBS_LOGGER_LEVEL=info
    volumes:
      - rustfs-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://localhost:9000/health && curl -f http://localhost:9001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  rinko-auth:
    image: rinko-auth:latest
    container_name: rinko-auth
    depends_on:
      - nacos
      - seata-server
      - skywalking-oap
      - kafka
    environment:
      - JAVA_OPTS=--add-opens java.base/java.lang=ALL-UNNAMED \
        --add-opens java.base/java.lang.reflect=ALL-UNNAMED \
        --add-opens java.base/java.lang.invoke=ALL-UNNAMED \
        --add-opens java.base/java.util=ALL-UNNAMED
    entrypoint:
      [
        "java",
        "--add-opens", "java.base/java.lang=ALL-UNNAMED",
        "--add-opens", "java.base/java.lang.reflect=ALL-UNNAMED",
        "--add-opens", "java.base/java.lang.invoke=ALL-UNNAMED",
        "--add-opens", "java.base/java.util=ALL-UNNAMED",
        "-javaagent:/app/skywalking-agent/skywalking-agent.jar",
        "-Dskywalking.agent.service_name=rinko-auth",
        "-Dskywalking.collector.backend_service=skywalking-oap:11800",
        "-jar",
        "/app/app.jar"
      ]
    volumes:
      - ./docker/skywalking-agent/:/app/skywalking-agent/

  rinko-gateway:
    image: rinko-gateway:latest
    container_name: rinko-gateway
    depends_on:
      - nacos
      - seata-server
      - skywalking-oap
      - kafka
    environment:
      - JAVA_OPTS=--add-opens java.base/java.lang=ALL-UNNAMED \
        --add-opens java.base/java.lang.reflect=ALL-UNNAMED \
        --add-opens java.base/java.lang.invoke=ALL-UNNAMED \
        --add-opens java.base/java.util=ALL-UNNAMED
      - NACOS_SERVER=nacos:8848
    entrypoint:
      [
        "java",
        "--add-opens", "java.base/java.lang=ALL-UNNAMED",
        "--add-opens", "java.base/java.lang.reflect=ALL-UNNAMED",
        "--add-opens", "java.base/java.lang.invoke=ALL-UNNAMED",
        "--add-opens", "java.base/java.util=ALL-UNNAMED",
        "-javaagent:/app/skywalking-agent/skywalking-agent.jar",
        "-Dskywalking.agent.service_name=rinko-gateway",
        "-Dskywalking.collector.backend_service=skywalking-oap:11800",
        "-jar",
        "/app/app.jar"
      ]
    ports:
      - "10315:10315"
    volumes:
      - ./docker/skywalking-agent/:/app/skywalking-agent/

  rinko-log:
    image: rinko-log:latest
    container_name: rinko-log
    depends_on:
      - nacos
      - seata-server
      - skywalking-oap
      - kafka
    environment:
      - JAVA_OPTS=--add-opens java.base/java.lang=ALL-UNNAMED \
        --add-opens java.base/java.lang.reflect=ALL-UNNAMED \
        --add-opens java.base/java.lang.invoke=ALL-UNNAMED \
        --add-opens java.base/java.util=ALL-UNNAMED
      - NACOS_SERVER=nacos:8848
    entrypoint:
      [
        "java",
        "--add-opens", "java.base/java.lang=ALL-UNNAMED",
        "--add-opens", "java.base/java.lang.reflect=ALL-UNNAMED",
        "--add-opens", "java.base/java.lang.invoke=ALL-UNNAMED",
        "--add-opens", "java.base/java.util=ALL-UNNAMED",
        "-javaagent:/app/skywalking-agent/skywalking-agent.jar",
        "-Dskywalking.agent.service_name=rinko-log",
        "-Dskywalking.collector.backend_service=skywalking-oap:11800",
        "-jar",
        "/app/app.jar"
      ]
    volumes:
      - ./docker/skywalking-agent/:/app/skywalking-agent/

  rinko-oss:
    image: rinko-oss:latest
    container_name: rinko-oss
    depends_on:
      - nacos
      - seata-server
      - skywalking-oap
      - kafka
    environment:
      - JAVA_OPTS=--add-opens java.base/java.lang=ALL-UNNAMED \
        --add-opens java.base/java.lang.reflect=ALL-UNNAMED \
        --add-opens java.base/java.lang.invoke=ALL-UNNAMED \
        --add-opens java.base/java.util=ALL-UNNAMED
      - NACOS_SERVER=nacos:8848
    entrypoint:
      [
        "java",
        "--add-opens", "java.base/java.lang=ALL-UNNAMED",
        "--add-opens", "java.base/java.lang.reflect=ALL-UNNAMED",
        "--add-opens", "java.base/java.lang.invoke=ALL-UNNAMED",
        "--add-opens", "java.base/java.util=ALL-UNNAMED",
        "-javaagent:/app/skywalking-agent/skywalking-agent.jar",
        "-Dskywalking.agent.service_name=rinko-oss",
        "-Dskywalking.collector.backend_service=skywalking-oap:11800",
        "-jar",
        "/app/app.jar"
      ]
    volumes:
      - ./docker/skywalking-agent/:/app/skywalking-agent/

  rinko-notify:
    image: rinko-notify:latest
    container_name: rinko-notify
    depends_on:
      - nacos
      - seata-server
      - skywalking-oap
      - kafka
    environment:
      - JAVA_OPTS=--add-opens java.base/java.lang=ALL-UNNAMED \
        --add-opens java.base/java.lang.reflect=ALL-UNNAMED \
        --add-opens java.base/java.lang.invoke=ALL-UNNAMED \
        --add-opens java.base/java.util=ALL-UNNAMED
      - NACOS_SERVER=nacos:8848
    entrypoint:
      [
        "java",
        "--add-opens", "java.base/java.lang=ALL-UNNAMED",
        "--add-opens", "java.base/java.lang.reflect=ALL-UNNAMED",
        "--add-opens", "java.base/java.lang.invoke=ALL-UNNAMED",
        "--add-opens", "java.base/java.util=ALL-UNNAMED",
        "-javaagent:/app/skywalking-agent/skywalking-agent.jar",
        "-Dskywalking.agent.service_name=rinko-notify",
        "-Dskywalking.collector.backend_service=skywalking-oap:11800",
        "-jar",
        "/app/app.jar"
      ]
    volumes:
      - ./docker/skywalking-agent/:/app/skywalking-agent/

  rinko-scheduler:
    image: rinko-scheduler:latest
    container_name: rinko-scheduler
    depends_on:
      - nacos
      - seata-server
      - skywalking-oap
      - kafka
    environment:
      - JAVA_OPTS=--add-opens java.base/java.lang=ALL-UNNAMED \
        --add-opens java.base/java.lang.reflect=ALL-UNNAMED \
        --add-opens java.base/java.lang.invoke=ALL-UNNAMED \
        --add-opens java.base/java.util=ALL-UNNAMED
      - NACOS_SERVER=nacos:8848
    entrypoint:
      [
        "java",
        "--add-opens", "java.base/java.lang=ALL-UNNAMED",
        "--add-opens", "java.base/java.lang.reflect=ALL-UNNAMED",
        "--add-opens", "java.base/java.lang.invoke=ALL-UNNAMED",
        "--add-opens", "java.base/java.util=ALL-UNNAMED",
        "-javaagent:/app/skywalking-agent/skywalking-agent.jar",
        "-Dskywalking.agent.service_name=rinko-scheduler",
        "-Dskywalking.collector.backend_service=skywalking-oap:11800",
        "-jar",
        "/app/app.jar"
      ]
    volumes:
      - ./docker/skywalking-agent/:/app/skywalking-agent/

volumes:
  nacos-data:
  postgres-data:
  redis-data:
  rabbitmq-data:
  #  zookeeper-data:
  #  zookeeper-log:
  kafka-data:
  clickhouse-data:
  clickhouse-log:
  seata-data:
  rustfs-data: